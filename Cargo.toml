[workspace]
members = [
    "crates/rn_core",
    "crates/rn_input",
    "crates/rn_ui", 
    "tools/apu_probe",
    "tools/nes_asm",
    "tools/nes_debugger",
    "tools/rom_test", "tools/waveform_player",
]
resolver = "2"

# Workspace-wide configuration and optimization
[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Pietro Atzeni"]
description = "NES emulator written in Rust"
repository = "https://github.com/beoboo/rustnes3"
license = "MIT OR Apache-2.0"

# Common dependencies for workspace members
# An unoptimized build is far too slow to emulate in real time: a plain `cargo build` runs the
# emulator at only ~1.4x real time, and once the debugger also renders its widgets each frame the
# margin vanishes, starving the audio buffer and making sound stutter.
#
# Optimizing the dev profile fixes that while keeping debug assertions and debug info. Dependencies
# get full optimization (they are compiled once and rarely stepped through); our own crates get
# opt-level 2, which is enough for comfortable real-time audio and still debuggable.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

# Lints are denied, not warned, so a warning fails the build rather than scrolling past.
# Every crate opts in via `[lints] workspace = true`.
#
# Rationale: warnings that are merely printed accumulate until real ones are invisible. This
# codebase reached ~80 before they were cleaned up, which hid genuinely dead code — an unused
# accessor and a `#[cfg(not(test))]` bypass that masked a real sweep-unit bug.
#
# If a lint is wrong for a specific case, silence it at the narrowest scope with `#[allow(...)]`
# and a comment saying why. Do not weaken the settings here.
[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[workspace.dependencies]
anyhow = "1.0"
cpal = "0.15"
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
derive_more = { version = "2.0", features = ["debug"] }
egui = "0.31"
egui_dock = "0.16"
eframe = "0.31"
lazy_static = "1.4.0"
log = "0.4"
parse-display = "0.10"
regex = "1.10.2"
# Native file dialogs. egui has none of its own, and the alternative is asking the user to type a
# path into a text box, which is not a file picker.
rfd = "0.15"
ringbuf = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

# Transitive dependency of winit/eframe, declared here only to enable one feature.
#
# macOS now returns a Swift-backed array from NSScreen.screens, whose
# countByEnumeratingWithState: is declared NSUInteger where objc2 expects NSInteger. objc2's
# debug-only encoding verification treats that sign mismatch as fatal and aborts before the window
# opens ("expected return to have type code 'q', but found 'Q'"). `relax-sign-encoding` makes the
# check ignore signedness, which is exactly the case this feature exists for. Signedness does not
# affect the ABI here, so the call itself was always correct — only the assertion was wrong.
#
# Removable once eframe/winit move to objc2 0.6+.
objc2 = { version = "0.5", features = ["relax-sign-encoding"] }
tracing-subscriber = "0.3"
