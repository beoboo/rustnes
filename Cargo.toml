[workspace]
members = [
    "crates/rn_core",
    "crates/rn_input",
    "crates/rn_ui", 
    "tools/nes_asm",
    "tools/nes_debugger", "tools/waveform_player",
]
resolver = "2"

# Workspace-wide configuration and optimization
[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Your Name"]
description = "NES emulator written in Rust"
repository = "https://github.com/yourusername/rustnes3"
license = "MIT OR Apache-2.0"

# Common dependencies for workspace members
[workspace.dependencies]
anyhow = "1.0"
cpal = "0.15"
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
egui = "0.31"
egui_dock = "0.16"
eframe = "0.31"
lazy_static = "1.4.0"
log = "0.4"
parse-display = "0.10"
regex = "1.10.2"
ringbuf = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing-subscriber = "0.3"
