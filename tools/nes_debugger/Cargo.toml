[package]
name = "nes_debugger"
version = "0.1.0"
edition = "2021"
authors = ["Your Name"]
description = "NES debugger for RustNES - visualize and debug NES hardware components"

[dependencies]
anyhow = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true }
egui_dock = "0.16"
log = "0.4"
tracing-subscriber = { workspace = true, features = ["env-filter"] }
clap = { version = "4.4", features = ["derive"] }
rn_core = { path = "../../crates/rn_core" }
rn_ui = { path = "../../crates/rn_ui" } 