[package]
name = "nesref"
version = "0.1.0"
edition = "2021"
description = "Ask a reference emulator what a test ROM says, for comparison against ours"
publish = false

[dependencies]
# A path outside this repository, which is why this crate is excluded from the workspace: it only
# builds where someone has cloned tetanes, and `cargo build` at the root must not depend on that.
#
# The `trace` feature is what makes `--trace` possible: it is the only way tetanes emits one line
# per instruction, and that line is what the differential diff is built on.
tetanes-core = { path = "../../../tetanes/tetanes-core", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"

